name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Install the documented CPU runtime and build
        run: bash studio/setup.sh --torch cpu --dev
      - name: Backend tests without provider downloads
        run: .venv/bin/python -m pytest studio/backend/tests -q
      - name: Frontend tests
        working-directory: studio/frontend
        run: npm test
      - name: Check whitespace
        run: git diff --check
